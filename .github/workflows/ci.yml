name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e "."
      - name: Check imports
        run: |
          python -c "from shazam2mqtt.config import Config; print('imports OK')"
      - name: Syntax check
        run: |
          python -m py_compile shazam2mqtt/*.py
