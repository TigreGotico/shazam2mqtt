[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shazam2mqtt"
dynamic = ["version"]
description = "Shazam-to-MQTT bridge with Home Assistant auto-discovery"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "TigreGotico"},
]
dependencies = [
    "aiohttp>=3.8",
    "numpy>=1.24",
    "paho-mqtt>=1.6",
    "xazam",
    "sounddevice>=0.4",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["shazam2mqtt*"]

[tool.setuptools.dynamic]
version = {attr = "shazam2mqtt.version.__version__"}
