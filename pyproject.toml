[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shazam2mqtt"
dynamic = ["version"]
description = "Shazam-to-MQTT bridge with Home Assistant auto-discovery"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "TigreGotico"},
]
dependencies = [
    "aiohttp>=3.8",
    "numpy>=1.24",
    "paho-mqtt>=1.6",
    "xazam",
    "sounddevice>=0.4",
]

[tool.hatch.version]
path = "shazam2mqtt/version.py"
pattern = "VERSION_MAJOR = (?P<major>\\d+)\\nVERSION_MINOR = (?P<minor>\\d+)\\nVERSION_BUILD = (?P<patch>\\d+)\\nVERSION_ALPHA = (?P<release>\\d+)"

[tool.hatch.build.targets.wheel]
packages = ["shazam2mqtt"]
